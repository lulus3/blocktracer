services:
  ganache:
    image: trufflesuite/ganache:latest
    container_name: productorigin-ganache
    ports:
      - "127.0.0.1:8545:8545"
    command:
      - "--chain.chainId=1337"
      - "--chain.networkId=1337"
      - "--chain.hardfork=shanghai"
      - "--wallet.totalAccounts=10"
      - "--wallet.defaultBalance=1000"
      - "--wallet.deterministic"
      - "--database.dbPath=/data"
    volumes:
      - ganache-data:/data
    restart: unless-stopped

  compiler:
    image: ethereum/solc:0.8.24
    profiles: ["tools"]
    volumes:
      - ./:/sources:ro
      - ./artifacts/solc:/artifacts
    command:
      - "--overwrite"
      - "--optimize"
      - "--via-ir"
      - "--evm-version"
      - "shanghai"
      - "--abi"
      - "--bin"
      - "--output-dir"
      - "/artifacts"
      - "${CONTRACT_SOURCE_PATH:-/sources/ProductOriginChain.sol}"

  deployer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      PROVIDER_URL: http://ganache:8545
      CONTRACT_ARTIFACT_PATH: /app/artifacts/solc
      ENV_FILE_PATH: /workspace/.env
    depends_on:
      - ganache
    volumes:
      - ./artifacts/solc:/app/artifacts/solc:ro
      - ./:/workspace
    command: ["python", "scripts/deploy_contract.py", "--update-env"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROVIDER_URL: http://ganache:8545
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-blockchain}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_QR_PREFIX: ${MINIO_QR_PREFIX:-qrcodes}
    depends_on:
      - ganache
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROVIDER_URL: http://ganache:8545
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
    depends_on:
      - ganache
    ports:
      - "8502:8501"
    command: ["streamlit", "run", "verifier_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    restart: unless-stopped

volumes:
  ganache-data:
